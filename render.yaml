# Render blueprint: the API as an always-on web service with a persistent disk. The web app is a static site (or deploy client/ on Vercel).
# Secrets (sync: false) are entered once in the Render dashboard; none of them lives in this file.
services:
  - type: web
    name: conversa-api
    runtime: docker
    rootDir: server
    plan: starter            # a free instance sleeps and would miss webhooks; use an always-on plan
    healthCheckPath: /api/health
    disk: { name: conversa-files, mountPath: /data, sizeGB: 5 }
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: SERVER_URL, sync: false }
      - { key: CLIENT_URL, sync: false }
      - { key: MONGODB_URI, sync: false }
      - { key: ENCRYPTION_KEY, generateValue: true }
      - { key: META_APP_ID, sync: false }
      - { key: META_APP_SECRET, sync: false }
      - { key: META_WEBHOOK_VERIFY_TOKEN, generateValue: true }
      - { key: META_GRAPH_API_VERSION, value: v26.0 }
      - { key: WHATSAPP_EMBEDDED_SIGNUP_CONFIG_ID, sync: false }
      - { key: GROQ_API_KEY, sync: false }
      - { key: GROQ_MODEL, value: openai/gpt-oss-20b }
      - { key: PAYMENT_PROOF_DIR, value: /data/proofs }
  - type: web
    name: conversa-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes: [{ type: rewrite, source: /*, destination: /index.html }]
    envVars:
      - { key: VITE_DEMO_MODE, value: "false" }
      - { key: VITE_API_BASE_URL, sync: false }
